<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTAHub - Panel de Misiones y Actividades</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2e;
      --bg-card-hover: #1c263d;
      --border-color: #243049;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --success: #22c55e;
      --success-glow: rgba(34, 197, 94, 0.25);
      --warning: #f59e0b;
      --danger: #ef4444;
      --motero: #f97316;
      --pandilla: #10b981;
      --grupo: #8b5cf6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 25px;
      background: linear-gradient(135deg, #111827 0%, #1e293b 100%);
      padding: 20px 24px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .header-info h1 {
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: -0.5px;
    }
    .header-info h1 span {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-info p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .tz-toggle-container {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      padding: 5px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-tz {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .btn-tz:hover {
      color: #fff;
    }
    .btn-tz.active {
      background: var(--primary);
      color: #0b0f19;
      font-weight: 700;
      box-shadow: 0 0 12px var(--primary-glow);
    }
    .tz-badge {
      font-size: 10px;
      font-family: 'Consolas', monospace;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }
    .btn-tz.active .tz-badge {
      background: rgba(11, 15, 25, 0.25);
      color: #0b0f19;
      font-weight: 800;
    }

    .clock-box {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .clock-icon {
      color: var(--primary);
      font-size: 20px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .clock-text {
      font-family: 'Consolas', monospace;
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
    }
    .clock-day {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* STATS STRIP */
    .stats-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stat-card-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .stat-card-val {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
    }
    .stat-card-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .icon-active { background: var(--success-glow); color: var(--success); }
    .icon-total { background: var(--primary-glow); color: var(--primary); }
    .icon-motero { background: rgba(249, 115, 22, 0.2); color: var(--motero); }
    .icon-pandilla { background: rgba(16, 185, 129, 0.2); color: var(--pandilla); }

    /* CONTROLS BAR */
    .controls-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 25px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
    }
    .search-box input {
      width: 100%;
      background: #0b0f19;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 14px 10px 40px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .filter-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    select {
      background: #0b0f19;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 16px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--primary); }

    .view-toggle {
      display: flex;
      background: #0b0f19;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
    }
    .btn-view {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-view.active {
      background: var(--primary);
      color: #0b0f19;
      font-weight: 700;
    }

    /* GRID VIEW */
    .missions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .mission-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }
    .mission-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }
    .mission-card.is-active {
      border-color: var(--success);
      box-shadow: 0 0 20px var(--success-glow);
    }

    .card-banner {
      height: 140px;
      position: relative;
      background: #0f172a;
      overflow: hidden;
    }
    .card-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .mission-card:hover .card-banner img {
      transform: scale(1.05);
    }
    .card-banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15,23,42,0.2) 0%, rgba(21,28,46,0.95) 100%);
    }

    .status-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(8px);
    }
    .status-active {
      background: rgba(34, 197, 94, 0.9);
      color: #fff;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
    }
    .status-next {
      background: rgba(245, 158, 11, 0.9);
      color: #fff;
    }
    .status-inactive {
      background: rgba(15, 23, 42, 0.85);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
    }

    .group-pill {
      position: absolute;
      bottom: 12px;
      left: 14px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .pill-motero { background: rgba(249, 115, 22, 0.9); color: #fff; }
    .pill-pandilla { background: rgba(16, 185, 129, 0.9); color: #fff; }
    .pill-grupo { background: rgba(139, 92, 246, 0.9); color: #fff; }

    .card-body {
      padding: 16px 18px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 12px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .req-box {
      background: #0f172a;
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      color: #fbbf24;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .req-box i { margin-top: 2px; }

    .schedule-strip {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      background: rgba(15,23,42,0.5);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .schedule-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .schedule-label {
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .schedule-val {
      font-family: 'Consolas', monospace;
      font-weight: 700;
      color: #e2e8f0;
    }
    .schedule-highlight {
      color: var(--success) !important;
      font-weight: 800;
    }

    .points-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      width: fit-content;
    }

    /* TABLE VIEW */
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow-x: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }
    th {
      background: #0f172a;
      color: var(--primary);
      padding: 14px 18px;
      font-weight: 700;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }
    td {
      padding: 12px 18px;
      border-bottom: 1px solid #1e293b;
      vertical-align: middle;
    }
    tr.tr-active {
      background: rgba(34, 197, 94, 0.08);
    }
    tr:hover {
      background: rgba(56, 189, 248, 0.04);
    }
    .tbl-img {
      width: 50px;
      height: 35px;
      border-radius: 6px;
      object-fit: cover;
      background: #0f172a;
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }
    .modal-close:hover { color: #fff; border-color: var(--primary); }

    .loot-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .loot-item {
      background: #0f172a;
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* EMPTY STATE */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state i {
      font-size: 48px;
      margin-bottom: 12px;
      color: var(--border-color);
    }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="header-info">
      <h1><i class="fa-solid fa-crosshairs"></i> GTAHub <span>Actividades & Misiones</span></h1>
      <p>Panel en tiempo real de horarios, requisitos, recompensas y disponibilidad</p>
    </div>
    <div class="header-right">
      <div class="tz-toggle-container">
        <button class="btn-tz active" id="btnTzLocal" onclick="setTimeMode('local')">
          <i class="fa-solid fa-house-user"></i> <span>Horario Local</span>
          <span class="tz-badge" id="tzOffsetBadge">GMT-3</span>
        </button>
        <button class="btn-tz" id="btnTzUTC" onclick="setTimeMode('utc')">
          <i class="fa-solid fa-earth-americas"></i> <span>Servidor (UTC)</span>
        </button>
      </div>
      <div class="clock-box">
        <i class="fa-solid fa-clock clock-icon"></i>
        <div>
          <div class="clock-text" id="mainClock">--:--:--</div>
          <div class="clock-day" id="mainDayText">--</div>
        </div>
      </div>
    </div>
  </div>

  <!-- STATS STRIP -->
  <div class="stats-strip">
    <div class="stat-card">
      <div>
        <div class="stat-card-title">Disponibles Ahora</div>
        <div class="stat-card-val" id="statActive" style="color: var(--success);">0</div>
      </div>
      <div class="stat-card-icon icon-active"><i class="fa-solid fa-bolt"></i></div>
    </div>
    <div class="stat-card">
      <div>
        <div class="stat-card-title">Total de Misiones</div>
        <div class="stat-card-val" id="statTotal">0</div>
      </div>
      <div class="stat-card-icon icon-total"><i class="fa-solid fa-list-check"></i></div>
    </div>
    <div class="stat-card">
      <div>
        <div class="stat-card-title">Misiones Moteros</div>
        <div class="stat-card-val" id="statMotero" style="color: var(--motero);">0</div>
      </div>
      <div class="stat-card-icon icon-motero"><i class="fa-solid fa-motorcycle"></i></div>
    </div>
    <div class="stat-card">
      <div>
        <div class="stat-card-title">Misiones Pandillas</div>
        <div class="stat-card-val" id="statPandilla" style="color: var(--pandilla);">0</div>
      </div>
      <div class="stat-card-icon icon-pandilla"><i class="fa-solid fa-cannabis"></i></div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls-bar">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Buscar por misión, ítem, recompensa..." oninput="render()">
    </div>

    <div class="filter-group">
      <select id="filterStatus" onchange="render()">
        <option value="all">⚡ Todo el estado</option>
        <option value="active">🟢 Solo Disponibles Ahora</option>
        <option value="today">📅 Abren Hoy</option>
      </select>

      <select id="filterGroup" onchange="render()">
        <option value="all">👥 Todas las Organizaciones</option>
        <option value="motero">🏍️ Motero (MC)</option>
        <option value="pandilla">🌿 Pandilla</option>
        <option value="grupo">🏢 Grupos</option>
      </select>

      <select id="filterDay" onchange="render()">
        <option value="all">📅 Todos los días</option>
        <option value="today">⭐ Abren Hoy</option>
        <option value="lun">Lunes</option>
        <option value="mar">Martes</option>
        <option value="mie">Miércoles</option>
        <option value="jue">Jueves</option>
        <option value="vie">Viernes</option>
        <option value="sab">Sábado</option>
        <option value="dom">Domingo</option>
      </select>

      <div class="view-toggle">
        <button class="btn-view active" id="btnGrid" onclick="setView('grid')"><i class="fa-solid fa-table-cells-large"></i> Cards</button>
        <button class="btn-view" id="btnTable" onclick="setView('table')"><i class="fa-solid fa-table-list"></i> Tabla</button>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="missions-grid" id="missionsGrid"></div>

  <div class="table-container" id="tableContainer">
    <table>
      <thead>
        <tr>
          <th>Foto</th>
          <th>Misión</th>
          <th>Organización</th>
          <th>Estado Actual</th>
          <th id="tblHeaderHorarios">Horarios</th>
          <th id="tblHeaderDias">Días Disponibles</th>
          <th>Requisitos</th>
          <th>Puntos</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<!-- DETAILS MODAL -->
<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal-content" id="modalContent"></div>
</div>

  const dayNames = { lun: "Lunes", mar: "Martes", mie: "Miércoles", jue: "Jueves", vie: "Viernes", sab: "Sábado", dom: "Domingo" };
  const dayKeys = ["lun", "mar", "mie", "jue", "vie", "sab", "dom"];

  let rawMissions = [];
  let currentView = 'grid';
  let timeMode = localStorage.getItem('gtahub_time_mode') || 'local';

  function normalize(s) {
    return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
  }

  function cleanName(n) {
    return n.trim().replace(/^mision/i, "Misión").replace(/quimicos/i, "químicos").replace(/organos/i, "órganos").replace(/vehiculos/i, "vehículos").replace(/almacen/i, "almacén").replace(/acuatica/i, "acuática");
  }

  function getMeta(name, group) {
    const normName = normalize(name);
    const normGrp = normalize(group);
    const fullKey = `${normName}|${normGrp}`;

    if (FACTION_DB[fullKey]) return FACTION_DB[fullKey];

    // Fallback: search by name matching within the same faction
    for (const k in FACTION_DB) {
      const [kName, kGrp] = k.split('|');
      if (kGrp === normGrp && (kName.includes(normName) || normName.includes(kName))) {
        return FACTION_DB[k];
      }
    }

    // Generic fallback
    return {
      img: "https://cdn.gtahub.gg/ui/maletin.png",
      pts: 5,
      req: "Requisitos de facción",
      desc: "Actividad oficial de organización.",
      loot: ["Recompensas monetarias y puntos diarios"]
    };
  }

  function getLocalOffsetMinutes() {
    return -new Date().getTimezoneOffset();
  }

  function getGMTOffsetString() {
    const offset = getLocalOffsetMinutes();
    const sign = offset >= 0 ? '+' : '-';
    const abs = Math.abs(offset);
    const h = Math.floor(abs / 60);
    const m = abs % 60;
    return m === 0 ? `GMT${sign}${h}` : `GMT${sign}${h}:${m.toString().padStart(2, '0')}`;
  }

  function setTimeMode(mode) {
    timeMode = mode;
    localStorage.setItem('gtahub_time_mode', mode);
    updateTzButtons();
    updateClock();
    render();
  }

  function updateTzButtons() {
    const btnLocal = document.getElementById('btnTzLocal');
    const btnUTC = document.getElementById('btnTzUTC');
    const tzOffsetBadge = document.getElementById('tzOffsetBadge');
    if (tzOffsetBadge) {
      tzOffsetBadge.textContent = getGMTOffsetString();
    }
    if (btnLocal) btnLocal.classList.toggle('active', timeMode === 'local');
    if (btnUTC) btnUTC.classList.toggle('active', timeMode === 'utc');
  }

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    return lines.map(line => {
      const parts = line.split(';');
      if (parts.length < 4) return null;
      const [name, timesStr, daysStr, group] = parts;
      const times = timesStr.split(',').map(t => {
        const [start, end] = t.split('-').map(Number);
        return { start, end };
      });
      const days = daysStr.split(',').map(d => d.trim().toLowerCase());
      const grp = group.trim().toLowerCase();
      return {
        name: cleanName(name),
        times,
        days,
        group: grp,
        meta: getMeta(name, grp)
      };
    }).filter(Boolean);
  }

  function getMissionSchedule(mission) {
    if (timeMode === 'utc') {
      const timesDisplay = mission.times.map(t => {
        const sStr = `${t.start.toString().padStart(2, '0')}:00`;
        const eStr = `${t.end.toString().padStart(2, '0')}:00`;
        return {
          startStr: sStr,
          endStr: eStr,
          label: `${t.start.toString().padStart(2, '0')}-${t.end.toString().padStart(2, '0')}hs`,
          fullLabel: `${sStr} - ${eStr}`,
          originalSlot: t
        };
      });
      const daysStr = mission.days.includes("todos")
        ? "Todos los días"
        : mission.days.map(d => dayNames[d] || d).join(', ');
      return { timesDisplay, daysStr, dayKeysList: mission.days };
    }

    // Local Mode
    const offsetMinutes = getLocalOffsetMinutes();
    const dayShiftedSet = new Set();

    const timesDisplay = mission.times.map(t => {
      const startMinTotal = t.start * 60 + offsetMinutes;
      const endMinTotal = t.end * 60 + offsetMinutes;

      const localStartMin = ((startMinTotal % 1440) + 1440) % 1440;
      const startH = Math.floor(localStartMin / 60);
      const startM = localStartMin % 60;
      const startDayShift = Math.floor(startMinTotal / 1440);

      const localEndMin = ((endMinTotal % 1440) + 1440) % 1440;
      const endH = Math.floor(localEndMin / 60);
      const endM = localEndMin % 60;

      const sStr = `${startH.toString().padStart(2, '0')}:${startM.toString().padStart(2, '0')}`;
      const eStr = `${endH.toString().padStart(2, '0')}:${endM.toString().padStart(2, '0')}`;
      const label = `${sStr} - ${eStr}`;

      if (!mission.days.includes("todos")) {
        mission.days.forEach(d => {
          const origIdx = dayKeys.indexOf(d);
          if (origIdx !== -1) {
            const localIdx = ((origIdx + startDayShift) % 7 + 7) % 7;
            dayShiftedSet.add(dayKeys[localIdx]);
          }
        });
      }

      return {
        startStr: sStr,
        endStr: eStr,
        label,
        fullLabel: `${sStr} - ${eStr}`,
        originalSlot: t
      };
    });

    let daysStr = "";
    let dayKeysList = [];

    if (mission.days.includes("todos")) {
      daysStr = "Todos los días";
      dayKeysList = ["todos"];
    } else {
      dayKeysList = dayKeys.filter(d => dayShiftedSet.has(d));
      daysStr = dayKeysList.map(d => dayNames[d] || d).join(', ');
    }

    return { timesDisplay, daysStr, dayKeysList };
  }

  function checkAvailability(mission) {
    const now = new Date();
    const utcHour = now.getUTCHours();
    const utcMinute = now.getUTCMinutes();
    const utcDayIdx = (now.getUTCDay() + 6) % 7;
    const utcDayKey = dayKeys[utcDayIdx];

    const localDayIdx = (now.getDay() + 6) % 7;
    const localDayKey = dayKeys[localDayIdx];

    const schedule = getMissionSchedule(mission);

    const utcDayMatch = mission.days.includes("todos") || mission.days.includes(utcDayKey);
    let isActiveNow = false;
    let activeSlot = null;
    let nextTimeStr = "";

    if (utcDayMatch) {
      for (const t of mission.times) {
        if (utcHour >= t.start && utcHour < t.end) {
          isActiveNow = true;
          activeSlot = t;
          const minsLeft = (t.end - utcHour) * 60 - utcMinute;
          const hLeft = Math.floor(minsLeft / 60);
          const mLeft = minsLeft % 60;
          nextTimeStr = `Cierra en ${hLeft > 0 ? hLeft + 'h ' : ''}${mLeft}m`;
          break;
        }
      }
    }

    const isTodayMatch = timeMode === 'local'
      ? (schedule.dayKeysList.includes("todos") || schedule.dayKeysList.includes(localDayKey))
      : utcDayMatch;

    if (!isActiveNow) {
      if (utcDayMatch) {
        const upcoming = mission.times.filter(t => t.start > utcHour).sort((a, b) => a.start - b.start)[0];
        if (upcoming) {
          const minsTo = (upcoming.start - utcHour) * 60 - utcMinute;
          const hTo = Math.floor(minsTo / 60);
          const mTo = minsTo % 60;
          nextTimeStr = `Abre en ${hTo > 0 ? hTo + 'h ' : ''}${mTo}m`;
        } else {
          nextTimeStr = isTodayMatch ? `Finalizó por hoy` : `Disponible: ${schedule.daysStr}`;
        }
      } else {
        nextTimeStr = isTodayMatch ? `Abre hoy` : `Disponible: ${schedule.daysStr}`;
      }
    }

    return {
      isActiveNow,
      activeSlot,
      isTodayMatch,
      nextTimeStr,
      schedule
    };
  }

  function render() {
    updateTzButtons();
    const now = new Date();
    const localDayIdx = (now.getDay() + 6) % 7;
    const localDayKey = dayKeys[localDayIdx];
    const utcDayIdx = (now.getUTCDay() + 6) % 7;
    const utcDayKey = dayKeys[utcDayIdx];
    const currentDayKey = timeMode === 'local' ? localDayKey : utcDayKey;

    const q = normalize(document.getElementById('searchInput').value);
    const filterStatus = document.getElementById('filterStatus').value;
    const filterGroup = document.getElementById('filterGroup').value;
    const filterDay = document.getElementById('filterDay').value;

    const grid = document.getElementById('missionsGrid');
    const tbody = document.getElementById('tableBody');
    grid.innerHTML = '';
    tbody.innerHTML = '';

    let activeCount = 0;
    let moteroCount = 0;
    let pandillaCount = 0;

    const filtered = rawMissions.filter(m => {
      const availability = checkAvailability(m);
      const { isActiveNow, isTodayMatch, schedule } = availability;

      if (isActiveNow) activeCount++;
      if (m.group === 'motero') moteroCount++;
      if (m.group === 'pandilla') pandillaCount++;

      // Filters
      if (filterGroup !== 'all' && m.group !== filterGroup) return false;

      if (filterStatus === 'active' && !isActiveNow) return false;
      if (filterStatus === 'today' && !isTodayMatch) return false;

      if (filterDay !== 'all') {
        const targetDay = filterDay === 'today' ? currentDayKey : filterDay;
        if (!schedule.dayKeysList.includes('todos') && !schedule.dayKeysList.includes(targetDay)) return false;
      }

      if (q) {
        const matchName = normalize(m.name).includes(q);
        const matchReq = normalize(m.meta.req).includes(q);
        const matchDesc = normalize(m.meta.desc).includes(q);
        const matchLoot = m.meta.loot && m.meta.loot.some(l => normalize(l).includes(q));
        if (!matchName && !matchReq && !matchDesc && !matchLoot) return false;
      }

      return true;
    });

    document.getElementById('statActive').textContent = activeCount;
    document.getElementById('statTotal').textContent = rawMissions.length;
    document.getElementById('statMotero').textContent = moteroCount;
    document.getElementById('statPandilla').textContent = pandillaCount;

    const tblHeaderHorarios = document.getElementById('tblHeaderHorarios');
    if (tblHeaderHorarios) {
      tblHeaderHorarios.textContent = timeMode === 'local' ? `Horarios (${getGMTOffsetString()})` : 'Horarios (UTC)';
    }

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state"><i class="fa-solid fa-folder-open"></i><h3>No se encontraron actividades con los filtros actuales</h3></div>`;
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:#94a3b8;">No se encontraron misiones</td></tr>`;
      return;
    }

    filtered.forEach((m) => {
      const availability = checkAvailability(m);
      const { isActiveNow, isTodayMatch, nextTimeStr, schedule, activeSlot } = availability;

      const pillClass = m.group === 'motero' ? 'pill-motero' : (m.group === 'pandilla' ? 'pill-pandilla' : 'pill-grupo');
      const statusClass = isActiveNow ? 'status-active' : (isTodayMatch ? 'status-next' : 'status-inactive');
      const statusIcon = isActiveNow ? '<i class="fa-solid fa-circle-play"></i> ACTIVA AHORA' : (isTodayMatch ? `<i class="fa-solid fa-clock"></i> ${nextTimeStr}` : `<i class="fa-solid fa-calendar-xmark"></i> ${nextTimeStr}`);

      const timesBadges = schedule.timesDisplay.map(t => {
        const isCurrent = isActiveNow && activeSlot === t.originalSlot;
        return `<span class="schedule-val ${isCurrent ? 'schedule-highlight' : ''}">${t.label}</span>`;
      }).join(', ');

      const daysStr = schedule.daysStr;

      // Card Element
      const card = document.createElement('div');
      card.className = `mission-card ${isActiveNow ? 'is-active' : ''}`;
      card.onclick = () => openModal(m);
      card.innerHTML = `
        <div class="card-banner">
          <img src="${m.meta.img}" alt="${m.name}" onerror="this.src='https://cdn.gtahub.gg/ui/maletin.png'">
          <div class="card-banner-overlay"></div>
          <div class="status-badge ${statusClass}">${statusIcon}</div>
          <div class="group-pill ${pillClass}">${m.group}</div>
        </div>
        <div class="card-body">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="points-badge"><i class="fa-solid fa-star"></i> +${m.meta.pts} Pts</div>
            <span style="font-size:11px; color:#94a3b8;"><i class="fa-solid fa-circle-info"></i> Ver Drops</span>
          </div>
          <div class="card-title">${m.name}</div>
          <div class="req-box"><i class="fa-solid fa-triangle-exclamation"></i> <div><strong>Requisitos:</strong> ${m.meta.req}</div></div>
          <div class="schedule-strip">
            <div class="schedule-row">
              <span class="schedule-label">Horarios (${timeMode === 'local' ? getGMTOffsetString() : 'UTC'}):</span>
              <span class="schedule-val" style="display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end;">${timesBadges}</span>
            </div>
            <div class="schedule-row">
              <span class="schedule-label">Días:</span>
              <span class="schedule-val" style="font-family:sans-serif; font-size:11px; color:#94a3b8;">${daysStr}</span>
            </div>
          </div>
        </div>
      `;
      grid.appendChild(card);

      // Table Row Element
      const tr = document.createElement('tr');
      if (isActiveNow) tr.classList.add('tr-active');
      tr.style.cursor = "pointer";
      tr.onclick = () => openModal(m);
      tr.innerHTML = `
        <td><img class="tbl-img" src="${m.meta.img}" onerror="this.src='https://cdn.gtahub.gg/ui/maletin.png'"></td>
        <td><strong style="color:#fff;">${m.name}</strong></td>
        <td><span class="group-pill ${pillClass}" style="position:static;">${m.group}</span></td>
        <td><span class="status-badge ${statusClass}" style="position:static; display:inline-flex;">${statusIcon}</span></td>
        <td><span style="font-family:Consolas, monospace;">${timesBadges}</span></td>
        <td><span style="color:#cbd5e1;">${daysStr}</span></td>
        <td><span style="color:#fbbf24; font-size:12px;">${m.meta.req}</span></td>
        <td><span class="points-badge">+${m.meta.pts} Pts</span></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function setView(view) {
    currentView = view;
    document.getElementById('btnGrid').classList.toggle('active', view === 'grid');
    document.getElementById('btnTable').classList.toggle('active', view === 'table');
    document.getElementById('missionsGrid').style.display = view === 'grid' ? 'grid' : 'none';
    document.getElementById('tableContainer').style.display = view === 'table' ? 'block' : 'none';
  }

  function openModal(m) {
    const modal = document.getElementById('modalBackdrop');
    const content = document.getElementById('modalContent');
    const availability = checkAvailability(m);
    const schedule = availability.schedule;

    const timesBadges = schedule.timesDisplay.map(t => {
      const isCurrent = availability.isActiveNow && availability.activeSlot === t.originalSlot;
      return `<span class="schedule-val ${isCurrent ? 'schedule-highlight' : ''}" style="display:inline-block; margin:2px 4px 2px 0;">${t.fullLabel}</span>`;
    }).join(' ');

    const lootHtml = m.meta.loot && m.meta.loot.length ? m.meta.loot.map(item => `<div class="loot-item"><i class="fa-solid fa-gift" style="color:var(--primary);"></i> ${item}</div>`).join('') : '<p style="color:#94a3b8; font-size:12px;">No especificado</p>';

    const tzLabel = timeMode === 'local' ? `Horarios (${getGMTOffsetString()} Local)` : `Horarios (UTC Servidor)`;
    const daysLabel = timeMode === 'local' ? `Días (${getGMTOffsetString()} Local)` : `Días (UTC Servidor)`;

    content.innerHTML = `
      <div class="modal-close" onclick="closeModalDirect()"><i class="fa-solid fa-xmark"></i></div>
      <div style="border-radius:12px; overflow:hidden; height:180px; margin-bottom:16px; position:relative;">
        <img src="${m.meta.img}" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://cdn.gtahub.gg/ui/maletin.png'">
        <div style="position:absolute; bottom:12px; left:14px;" class="group-pill ${m.group === 'motero' ? 'pill-motero' : (m.group === 'pandilla' ? 'pill-pandilla' : 'pill-grupo')}">${m.group}</div>
      </div>
      <h2 style="font-size:20px; font-weight:800; color:#fff; margin-bottom:8px;">${m.name}</h2>
      <p style="color:#cbd5e1; font-size:13px; line-height:1.5; margin-bottom:16px;">${m.meta.desc}</p>
      
      <div class="req-box" style="margin-bottom:16px;">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <div><strong>Requisitos Obligatorios:</strong><br>${m.meta.req}</div>
      </div>

      <div style="margin-bottom:16px;">
        <h4 style="font-size:12px; text-transform:uppercase; color:#94a3b8; margin-bottom:6px;">Recompensas Posibles (${m.meta.loot.length} ítems):</h4>
        <div class="loot-grid">${lootHtml}</div>
      </div>

      <div class="schedule-strip">
        <div class="schedule-row">
          <span class="schedule-label">Puntos Diarios:</span>
          <span class="points-badge">+${m.meta.pts} Pts</span>
        </div>
        <div class="schedule-row">
          <span class="schedule-label">${tzLabel}:</span>
          <div style="text-align:right;">${timesBadges}</div>
        </div>
        <div class="schedule-row">
          <span class="schedule-label">${daysLabel}:</span>
          <span class="schedule-val">${schedule.daysStr}</span>
        </div>
      </div>
    `;
    modal.style.display = 'flex';
  }

  function closeModalDirect() {
    document.getElementById('modalBackdrop').style.display = 'none';
  }

  function closeModal(e) {
    if (e.target.id === 'modalBackdrop') {
      closeModalDirect();
    }
  }

  function updateClock() {
    const now = new Date();
    const clockEl = document.getElementById('mainClock');
    const dayEl = document.getElementById('mainDayText');
    if (!clockEl || !dayEl) return;

    if (timeMode === 'utc') {
      const utcStr = now.toUTCString().split(' ')[4];
      const dayIdx = (now.getUTCDay() + 6) % 7;
      const dayName = dayNames[dayKeys[dayIdx]];
      clockEl.textContent = `${utcStr} UTC`;
      dayEl.textContent = `HOY: ${dayName.toUpperCase()} (UTC)`;
    } else {
      const h = now.getHours().toString().padStart(2, '0');
      const m = now.getMinutes().toString().padStart(2, '0');
      const s = now.getSeconds().toString().padStart(2, '0');
      const dayIdx = (now.getDay() + 6) % 7;
      const dayName = dayNames[dayKeys[dayIdx]];
      const tzStr = getGMTOffsetString();
      clockEl.textContent = `${h}:${m}:${s}`;
      dayEl.textContent = `HOY: ${dayName.toUpperCase()} (${tzStr})`;
    }
  }

  async function init() {
    updateTzButtons();
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(render, 30000);

    try {
      const res = await fetch('actividades.csv');
      const text = await res.text();
      rawMissions = parseCSV(text);
      render();
    } catch (e) {
      console.error("Error loading CSV:", e);
    }
  }

  window.onload = init;
</script>
</body>
</html>
